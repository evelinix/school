services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: school_mailpit
    restart: unless-stopped
    ports:
      - 8025:8025
      - 1025:1025
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: ${TZ:-Asia/Jakarta}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  rustfs_perms:
      image: alpine
      user: root
      volumes:
        - rustfs_perms:/fix_path
      command: chown -R 10001:10001 /fix_path
  rustfs:
      image: rustfs/rustfs:latest
      container_name: school_rustfs
      restart: unless-stopped
      ports:
        - "127.0.0.1:9000:9000"
        - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
      depends_on:
        rustfs_perms:
          condition: service_completed_successfully
      volumes:
        - rustfs_data:/data
      environment:
        RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
        RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
        RUSTFS_SSE_S3_MASTER_KEY: ${RUSTFS_SSE_S3_MASTER_KEY:?RUSTFS_SSE_S3_MASTER_KEY is required}
        RUSTFS_ADDRESS: ":9000"
        RUSTFS_CONSOLE_ADDRESS: ":9001"
        RUSTFS_CONSOLE_ENABLE: "true"
        RUSTFS_SERVER_DOMAINS: "rustfs:9000"
        RUSTFS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
        interval: 15s
        timeout: 5s
        retries: 5
        start_period: 20s

  # ===========================================================================
  # BUCKET INITIALIZER (one-shot, idempotent)
  # ===========================================================================
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: school_rustfs_init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET: ${AWS_BUCKET:?AWS_BUCKET is required}
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for RustFS...';
        until aws --endpoint-url=http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do
          sleep 2;
        done;
        echo 'Checking bucket: '$$S3_BUCKET;
        if aws --endpoint-url=http://rustfs:9000 s3api head-bucket --bucket $$S3_BUCKET 2>/dev/null; then
          echo 'Bucket exists — ensuring encryption...';
        else
          echo 'Creating bucket...';
          aws --endpoint-url=http://rustfs:9000 s3api create-bucket --bucket $$S3_BUCKET;
          echo 'Bucket created — enabling default encryption...';
        fi;
        aws --endpoint-url=http://rustfs:9000 s3api put-bucket-encryption --bucket $$S3_BUCKET --server-side-encryption-configuration '{\"Rules\":[{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"AES256\"}}]}';
        echo 'Done.';
      "


volumes:
  mailpit_data:
    name: mailpit_data
  rustfs_perms:
    name: rustfs_perms_data
  rustfs_data:
    name: rustfs_data
  rustfs_logs:
    name: rustfs_logs